[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geosite-agent"
version = "2.0.0"
description = "Deterministic, explainable offline site selection prototype"
requires-python = ">=3.11"
dependencies = ["shapely>=2.1,<3", "pyproj>=3.7,<4", "pydantic>=2.11,<3", "rasterio>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
retail = ["pandas>=2.2,<4", "streamlit>=1.45,<2", "folium>=0.19,<1", "streamlit-folium>=0.25,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
geosite = "geosite.cli:main"

[tool.setuptools.packages.find]
include = ["geosite*", "georetail*", "app.tool"]

[tool.setuptools.package-data]
geosite = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["geosite/**/*.py", "tests/**/*.py", "evals/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
