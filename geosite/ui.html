<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoSite Agent v2</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#172554;max-width:1100px;margin:30px auto;padding:0 20px}section{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:22px;margin:18px 0}h2{font-size:20px}textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #94a3b8;border-radius:8px;font:15px monospace}button{background:#1d4ed8;color:white;padding:11px 18px;border:0;border-radius:8px;margin:10px 8px 0 0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow:auto;background:#f8fafc;padding:12px}iframe{width:100%;height:650px;border:1px solid #cbd5e1}a{color:#1d4ed8;margin-right:14px}table{width:100%;border-collapse:collapse;table-layout:fixed}td{overflow-wrap:anywhere}td,th{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0}.note{color:#64748b}</style>
<h1>GeoSite Agent v2</h1><p>公共服务设施选址 · 可解释辅助决策原型</p><p class="note">离线规则解析 · 全部为合成数据 · 250 米网格采样 · 不代替法定规划和现场勘查</p>
<section><h2>1. 任务输入</h2><p>可用图层：演示区域、医院、工业风险点、主要道路。仅支持此合成区域。</p><textarea id="prompt" rows="3" aria-label="选址需求">在演示区域内，距医院不超过1000米、距工业风险点至少800米，优先靠近主要道路，推荐前三个位置</textarea><button id="parse">解析需求</button><button id="single">单约束示例</button><button id="ambiguous">澄清示例</button></section>
<section><h2>2. 需求确认</h2><p>编辑距离（米）、within / outside、偏好 weight 和 top_k。调整权重可重新排序。</p><textarea id="request" rows="14" aria-label="结构化参数" placeholder="先解析需求"></textarea><br><label><input id="confirm" type="checkbox">我已检查参数，确认使用演示数据执行</label><br><button id="run">确认并执行 / 重新排序</button></section>
<section><h2>3. 执行状态</h2><p id="status" role="status" aria-live="polite">等待输入</p><details><summary>查看阶段 Trace</summary><pre id="trace">暂无轨迹</pre></details></section>
<section><h2>4. 结果分析</h2><p id="empty">尚无结果。完成参数确认后查看地图与推荐。</p><div id="downloads"></div><div id="ranking"></div><iframe id="map" title="候选地图" hidden sandbox></iframe></section>
<script>
const $=id=>document.getElementById(id);let busy=false;
async function call(url,body){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('status').textContent='执行中：解析 / 数据预检 / GIS 计算 / 结果校验…';
try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const r=await response.json();if(!response.ok)throw Error('参数格式或数值不合法，请检查后重试');$('trace').textContent=JSON.stringify(r.trace,null,2);$('status').textContent=r.state+' · '+(r.message||r.result?.status||'');if(r.request)$('request').value=JSON.stringify({...r.request,confirmed:false},null,2);else $('request').value='';$('map').hidden=true;$('ranking').replaceChildren();$('downloads').replaceChildren();$('empty').textContent='等待确认或修正参数';
if(r.state==='COMPLETED'){$('empty').textContent=r.result.status==='empty'?'合法空结果：网格中无满足条件的候选，请调整参数重试。':'原始距离、评分分项和约束检查如下；完整明细可下载。';for(const a of r.result.artifacts){const link=document.createElement('a');link.href='/api/artifacts/'+a.relative_path;link.textContent=a.type;link.target='_blank';link.rel='noopener';$('downloads').append(link)}const table=document.createElement('table');const header=document.createElement('tr');for(const label of ['排名','候选 ID','得分','原始指标和评分依据']){const th=document.createElement('th');th.textContent=label;header.append(th)}table.append(header);for(const row of r.top_k){const tr=document.createElement('tr');for(const value of [row.rank,row.candidate_id,row.score.toFixed(6),JSON.stringify({distances_m:row.distances_m,components:row.components,constraints:row.constraints})]){const td=document.createElement('td');td.textContent=value;tr.append(td)}table.append(tr)}$('ranking').append(table);$('map').src='/api/artifacts/'+r.run_id+'/map.html';$('map').hidden=false}}
catch(e){$('status').textContent='执行失败：'+e.message+'。可修正后重试。'}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('parse').onclick=()=>{$('confirm').checked=false;call('/api/parse',{prompt:$('prompt').value})};$('run').onclick=()=>{if(!$('confirm').checked){$('status').textContent='请先勾选参数确认';return}try{const body=JSON.parse($('request').value);body.confirmed=true;call('/api/run',body)}catch{$('status').textContent='JSON 格式错误，请修正后重试'}};$('single').onclick=()=>{$('prompt').value='距医院不超过500米，推荐前三个位置'};$('ambiguous').onclick=()=>{$('prompt').value='在医院附近选址'};
</script></html>
